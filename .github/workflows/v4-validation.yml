name: Validate Multiplayer V4.3

on:
  push:
    branches:
      - main
    paths:
      - 'server.js'
      - 'full-simulation.js'
      - 'shared-game/**'
      - 'accounts/**'
      - 'test-accounts.js'
      - 'scripts/**'
      - 'test-full-game.js'
      - 'test-network-v41.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v4-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify shared source matches frontend release
        run: |
          COMMIT=$(node -p "require('./shared-game/manifest.json').frontendCommit")
          git clone --filter=blob:none https://github.com/pandapidio/pandapidio-games.git /tmp/rdm-frontend-reference
          git -C /tmp/rdm-frontend-reference checkout "$COMMIT"
          RDM_FRONTEND_SOURCE=/tmp/rdm-frontend-reference/games/rei-dos-mares node scripts/check-game-source.js
      - run: npm test
      - run: npm run test:accounts
      - name: Install network test client
        run: npm install --no-save socket.io-client@4.8.4
      - name: Three-client network pause resume party shop test
        run: node test-network-v41.js
      - name: Boot server and check local health
        shell: bash
        run: |
          PORT=3456 FRONTEND_ORIGINS=https://pandapidio.github.io node server.js > /tmp/rdm-v42.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; cat /tmp/rdm-v42.log' EXIT
          for i in {1..24}; do
            if curl -fsS http://127.0.0.1:3456/health > /tmp/health.json; then break; fi
            sleep 0.25
          done
          cat /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(!h.ok||h.protocol!=='rdm-v4'||h.fullGameplay!==true||h.authoritative!==true||h.simulationHz!==60||h.snapshotHz!==30) process.exit(1)"
          kill $PID
          wait $PID || true
          trap - EXIT
      - name: Wait for Railway V4.3 and smoke public WebSocket
        shell: bash
        run: |
          URL='https://rei-dos-mares-server-production.up.railway.app'
          READY=0
          for i in {1..60}; do
            if curl -fsS "$URL/health" > /tmp/public-health.json; then
              if node -e "const h=require('/tmp/public-health.json'); process.exit(h.version==='4.3.0-full-gameplay'&&h.protocol==='rdm-v4'&&h.authoritative===true?0:1)"; then
                READY=1
                break
              fi
            fi
            sleep 2
          done
          cat /tmp/public-health.json || true
          test "$READY" = 1
          node - <<'NODE'
          const {io}=require('socket.io-client');
          const url='https://rei-dos-mares-server-production.up.railway.app';
          const s=io(url,{transports:['websocket'],reconnection:false,timeout:8000,extraHeaders:{Origin:'https://pandapidio.github.io'}});
          const timer=setTimeout(()=>{console.error('public websocket timeout');s.disconnect();process.exit(1)},10000);
          s.on('server:hello',h=>{
            console.log(JSON.stringify({transport:s.io.engine.transport.name,hello:h}));
            if(h?.version!=='4.3.0-full-gameplay'||h?.protocol!=='rdm-v4'||!h?.authoritative||s.io.engine.transport.name!=='websocket')process.exitCode=1;
            clearTimeout(timer);s.disconnect();
          });
          s.on('connect_error',e=>{console.error(e.message);clearTimeout(timer);process.exit(1)});
          NODE
